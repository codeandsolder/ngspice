name: XSPICE build and regression

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xspice-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  xspice:
    name: Build original XSPICE and run native tests
    runs-on: [self-hosted, Linux, X64, local-ci, asus]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Autotools build and original XSPICE regression
        shell: bash
        run: |
          set -euo pipefail
          command -v gcc
          test -x /usr/local/bin/sccache

          source_root="$PWD"
          build_root="$(mktemp -d "$RUNNER_TEMP/ngspice-xspice-XXXXXXXX")"
          trap 'rm -rf -- "$build_root"' EXIT

          if ! ./autogen.sh >"$build_root/autogen.log" 2>&1; then
            tail -100 "$build_root/autogen.log"
            exit 1
          fi
          cd "$build_root"

          if ! CC="/usr/local/bin/sccache gcc" CFLAGS="-O2 -g" \
            "$source_root/configure" --prefix="$build_root/install" \
            --enable-xspice --enable-cider --with-readline=yes \
            --disable-debug >configure.log 2>&1; then
            tail -120 configure.log
            exit 1
          fi
          if ! make -j2 >build.log 2>&1; then
            tail -160 build.log
            exit 1
          fi
          if ! make -C tests/xspice/digital -j2 check >xspice-test.log 2>&1; then
            tail -150 xspice-test.log
            exit 1
          fi

          ./src/ngspice --version
          tail -25 xspice-test.log
