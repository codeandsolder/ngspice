name: Track upstream

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@f1499fe94abf45faacae7992670e5163109225f0 # main
    with:
      upstream-repository: imr/ngspice
      upstream-branch: master
      target-branch: master
      strategy: merge
      validation-script: .github/scripts/validate-upstream.sh
